name: Deploy AI Video Studio to GitHub Pages

on:
  push:
    branches: [claude/ai-video-studio-fzj2p]
    paths:
      - 'ai-video-studio/dist/**'
      - '.github/workflows/deploy-video-studio.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload pre-built dist to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ai-video-studio/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

name: Deploy AI Video Studio to GitHub Pages

on:
  push:
    branches: [claude/ai-video-studio-fzj2p]
    paths:
      - 'ai-video-studio/**'
      - '.github/workflows/deploy-video-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ai-video-studio/package-lock.json

      - name: Install dependencies
        working-directory: ai-video-studio
        run: npm ci

      - name: Build
        working-directory: ai-video-studio
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ai-video-studio/dist
          destination_dir: ai-video-studio
          keep_files: false
